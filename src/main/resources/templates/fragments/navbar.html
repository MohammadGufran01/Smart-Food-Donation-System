<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark glass-nav sticky-top py-3">
    <div class="container">
        <!-- Brand Logo -->
        <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4" href="/">
            <span class="brand-badge">🌱</span>
            <span class="text-white">Smart<span class="text-emerald text-success">Food</span></span>
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-2 mt-3 mt-lg-0">
                <li class="nav-item">
                    <a class="nav-link text-white px-3" href="/">Browse Food</a>
                </li>

                <!-- Logged Out User State -->
                <li class="nav-item" th:if="${session.loggedInUser == null}">
                    <a class="nav-link text-white-50 px-3" href="/login">Sign In</a>
                </li>
                <li class="nav-item" th:if="${session.loggedInUser == null}">
                    <a class="btn-primary-custom ms-lg-2" href="/register">
                        <span>Get Started</span>
                        <span>→</span>
                    </a>
                </li>

                <!-- Logged In User State -->
                <li class="nav-item" th:if="${session.loggedInUser != null}">
                    <a class="nav-link text-white px-3" href="/dashboard">Dashboard</a>
                </li>

                <!-- Role Specific Action -->
                <li class="nav-item" th:if="${session.loggedInUser != null and session.userRole == 'DONOR'}">
                    <a class="btn-primary-custom px-3 py-2" href="/donate">
                        <span>+ Post Food</span>
                    </a>
                </li>

                <!-- User Profile Pill -->
                <li class="nav-item ms-lg-2" th:if="${session.loggedInUser != null}">
                    <div class="dropdown">
                        <button class="btn btn-outline-light btn-sm rounded-pill px-3 py-2 dropdown-toggle d-flex align-items-center gap-2 border-opacity-25" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span th:if="${session.userRole == 'DONOR'}">👨‍🍳</span>
                            <span th:if="${session.userRole == 'NGO'}">🏢</span>
                            <span class="fw-semibold" th:text="${session.loggedInUser.name}">User</span>
                            <span class="badge bg-success bg-opacity-25 text-success rounded-pill px-2" th:text="${session.userRole}">ROLE</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 rounded-4 mt-2 p-2">
                            <li>
                                <div class="px-3 py-2 border-bottom mb-2">
                                    <div class="fw-bold text-dark" th:text="${session.loggedInUser.name}">User Name</div>
                                    <div class="small text-muted" th:text="${session.loggedInUser.email}">email@example.com</div>
                                </div>
                            </li>
                            <li><a class="dropdown-item rounded-3 py-2" href="/dashboard">📊 Dashboard</a></li>
                            <li th:if="${session.userRole == 'DONOR'}"><a class="dropdown-item rounded-3 py-2" href="/donate">🍲 Post Food Donation</a></li>
                            <li th:if="${session.userRole == 'NGO'}"><a class="dropdown-item rounded-3 py-2" href="/ngo/dashboard">📦 Claimed Pickups</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item rounded-3 py-2 text-danger" href="/logout">🚪 Logout</a></li>
                        </ul>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
